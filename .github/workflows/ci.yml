name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: riftdata
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: riftdata
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # 엔티티 검사(ddl-auto: validate)를 하려면 테이블이 먼저 있어야 한다.
      - name: Create tables
        run: mysql -h 127.0.0.1 -u root -proot riftdata < src/main/resources/db/schema.sql

      - name: Build and test
        run: ./gradlew build

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7

      # 배포 설정은 보류 중이라 main 빌드의 실행 파일(jar)만 보관한다.
      - name: Upload jar
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: build/libs/*.jar
          retention-days: 14
