# CSV 적재 전용 프로필. 웹 서버 없이 적재·재계산만 하고 끝난다.
#   ./gradlew bootRun --args="--spring.profiles.active=loader --loader.file=/경로/2026_LoL_esports_match_data_from_OraclesElixir.csv"
# 자세한 사용법은 docs/csv-loader.md
spring:
  main:
    web-application-type: none
  datasource:
    # 적재 계정 (sql/demo/01_users_grants.sql의 riftdata_loader 등). 없으면 공통 DB_USERNAME 계정
    username: ${DB_LOADER_USERNAME:${DB_USERNAME:root}}
    password: ${DB_LOADER_PASSWORD:${DB_PASSWORD:root}}
  jpa:
    show-sql: false

loader:
  league: LCK
  season-year: 2026
  source-zone: UTC
  # Oracle's Elixir teamname → 팀코드 (team.code, 최대 4자). 시즌 중 팀 이름이 바뀌면 여기에 추가한다.
  team-codes:
    "[T1]": T1
    "[Gen.G]": GEN
    "[Hanwha Life Esports]": HLE
    "[KT Rolster]": KT
    "[Dplus KIA]": DK
    "[BNK FEARX]": BFX
    "[Nongshim RedForce]": NS
    "[DRX]": DRX
    "[OKSavingsBank BRION]": BRO
    "[HANJIN BRION]": BRO
    "[DN Freecs]": DNF
    "[DN SOOPers]": DNS
