# 테스트 전용 설정. classpath:/config/의 프로필 설정이라 main의 application-local.yml보다 우선한다.
#
# 1) DB: 서버 DB(DB_NAME, 기본 riftdata)와 분리한 테스트 DB(TEST_DB_NAME, 기본 riftdata_test)를 쓴다.
#    서버 DB에 실데이터를 적재해도 테스트 결과가 바뀌지 않게 하려는 것이다.
#    DB가 없으면 만들고(createDatabaseIfNotExist), 테이블이 없으면 schema.sql로 만든다(아래 sql.init).
# 2) 계정: 테스트는 픽스처를 INSERT하고 롤백하므로 조회 전용 앱 계정(DB_APP_USERNAME)을 쓰면 안 된다.
#    앱 계정 설정을 무시하고 기존 계정(DB_USERNAME, DB_PASSWORD, 기본 root/root)으로 접속한다.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${TEST_DB_NAME:riftdata_test}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
