# 배포용 (GCP VM). MySQL + 백엔드. 사용법은 docs/deploy.md
#   docker compose -f docker-compose.prod.yml --env-file prod.env up -d
# 로컬 개발용 docker-compose.yml(MySQL만)과 별개다.
name: riftdata-prod

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?prod.env에 DB_ROOT_PASSWORD를 채우세요}
      MYSQL_DATABASE: riftdata
      MYSQL_USER: ${DB_USERNAME:?prod.env에 DB_USERNAME을 채우세요}
      MYSQL_PASSWORD: ${DB_PASSWORD:?prod.env에 DB_PASSWORD를 채우세요}
      DB_APP_USERNAME: ${DB_APP_USERNAME:?prod.env에 DB_APP_USERNAME을 채우세요}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?prod.env에 DB_APP_PASSWORD를 채우세요}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # 외부에 포트를 열지 않는다. 백엔드만 컨테이너 네트워크로 접속한다.
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./deploy/mysql-init/02-app-user.sh:/docker-entrypoint-initdb.d/02-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    image: riftdata-backend:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: riftdata
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_APP_USERNAME: ${DB_APP_USERNAME}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    # CSV 적재용 (docs/deploy.md 4단계). 저장소 루트의 data/ 폴더
    volumes:
      - ./data:/data:ro

volumes:
  mysql-data:
